name: Fetch Publications

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch publications from ORCID and enrich with PubMed
        run: |
          python3 << 'EOF'
          import json, urllib.request, time

          orcid_id = '0000-0002-3100-1132'
          headers = {'Accept': 'application/json'}

          # Get list of works from ORCID
          req = urllib.request.Request(f'https://pub.orcid.org/v3.0/{orcid_id}/works', headers=headers)
          with urllib.request.urlopen(req) as r:
              works = json.loads(r.read())

          items = []
          dois = []

          for group in works.get('group', []):
              summary = group['work-summary'][0]
              put_code = summary['put-code']

              req2 = urllib.request.Request(f'https://pub.orcid.org/v3.0/{orcid_id}/work/{put_code}', headers=headers)
              with urllib.request.urlopen(req2) as r2:
                  work = json.loads(r2.read())

              title = work.get('title', {}).get('title', {}).get('value', '')
              journal = work.get('journal-title', {}).get('value', '') if work.get('journal-title') else ''
              pub_date = work.get('publication-date') or {}
              year = pub_date.get('year', {}).get('value', '') if pub_date else ''

              doi = ''
              for ext_id in work.get('external-ids', {}).get('external-id', []):
                  if ext_id.get('external-id-type') == 'doi':
                      doi = ext_id.get('external-id-value', '')
                      break

              link = f'https://doi.org/{doi}' if doi else ''

              if title:
                  items.append({'title': title, 'link': link, 'year': year, 'author': '', 'journal': journal, 'doi': doi})
                  if doi:
                      dois.append(doi)

              time.sleep(0.1)

          # Enrich with PubMed data using DOIs
          if dois:
              doi_query = ' OR '.join(f'{doi}[doi]' for doi in dois[:50])
              search_url = f'https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=pubmed&term={urllib.request.quote(doi_query)}&retmax=100&retmode=json'
              with urllib.request.urlopen(search_url) as r:
                  search = json.loads(r.read())
              pmids = search.get('esearchresult', {}).get('idlist', [])

              if pmids:
                  summary_url = f'https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esummary.fcgi?db=pubmed&id={",".join(pmids)}&retmode=json'
                  with urllib.request.urlopen(summary_url) as r:
                      summaries = json.loads(r.read())

                  doi_lookup = {}
                  for pmid in pmids:
                      d = summaries.get('result', {}).get(pmid, {})
                      for eid in d.get('articleids', []):
                          if eid.get('idtype') == 'doi':
                              doi_lookup[eid['value'].lower()] = {
                                  'authors': ', '.join(a['name'] for a in d.get('authors', [])),
                                  'journal': d.get('fulljournalname', '')
                              }

                  for item in items:
                      doi_key = item.get('doi', '').lower()
                      if doi_key in doi_lookup:
                          item['author'] = doi_lookup[doi_key]['authors']
                          if not item['journal']:
                              item['journal'] = doi_lookup[doi_key]['journal']

          for item in items:
              item.pop('doi', None)

          # Deduplicate by title and filter to only papers with authors, journal and year
          seen_titles = set()
          filtered = []
          for item in items:
              title_key = item['title'].lower().strip().rstrip('.')
              if title_key not in seen_titles and item['author'] and item['journal'] and item['year']:
                  seen_titles.add(title_key)
                  filtered.append(item)
          items = filtered

          with open('static/publications.json', 'w') as f:
              json.dump(items, f)
          print(f'Saved {len(items)} publications')
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git add static/publications.json
          git diff --staged --quiet || git commit -m 'Update publications'
          git fetch origin
          git rebase origin/main
          git push
